apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gymbuddy-backend
  labels:
    cloud.googleapis.com/location: asia-southeast2
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: 253242815083-compute@developer.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: asia-southeast2-docker.pkg.dev/gen-lang-client-0130714675/gymbuddy/gymbuddy-backend:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "512Mi"
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: NODE_ENV
          value: "production"
        - name: GOOGLE_CLOUD_PROJECT
          value: "gen-lang-client-0130714675"
        - name: ENABLE_MONGO_DUAL_WRITE
          value: "false"
        # Secrets mounted from Google Secret Manager
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gymbuddy-gemini-api-key
              key: latest
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gymbuddy-jwt-secret
              key: latest
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: gymbuddy-twilio-account-sid
              key: latest
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: gymbuddy-twilio-auth-token
              key: latest
